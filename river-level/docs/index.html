<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>🌊 観測サイト</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg: #fff; --fg: #222; --panel: rgba(255,255,255,.94); --line: #ddd; --accent: #1f5fbf; --muted: #777; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1d21; --fg: #eee; --panel: rgba(32,34,38,.94); --line: #444; --accent: #7cb0ff; --muted: #aaa; }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  #map { position: absolute; inset: 0; }
  #head { position: absolute; top: 0; left: 0; right: 0; z-index: 2; padding: 6px 16px; background: var(--panel);
    border-bottom: 1px solid var(--line); font-size: 14px; }
  #head .row { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
  #head .row + .row { margin-top: 4px; }
  #head h1 { font-size: 16px; margin: 0 8px 0 0; }
  #head a, #panel a { color: var(--accent); }
  #head label { display: inline-flex; align-items: center; gap: 4px; }
  #head button, #panel button { font: inherit; font-size: 13px; padding: 2px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--fg); cursor: pointer; }
  #status { padding: 2px 10px; border-radius: 12px; background: #e8e8e8; color: #333; font-size: 13px; }
  /* 合言葉を入れるまでは何も出さない */
  #gate { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: flex; align-items: center; justify-content: center; }
  #gate .box { max-width: 360px; padding: 24px; border: 1px solid var(--line); border-radius: 12px; text-align: center; line-height: 1.8; }
  #gate input { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; width: 180px; }
  #gate button { font: inherit; padding: 6px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); cursor: pointer; }
  body.auth #gate { display: none; }
  #head, #legend, #map { visibility: hidden; }
  body.auth #head, body.auth #legend, body.auth #map { visibility: visible; }
  #status.active { background: #ffe0e0; color: #a00; font-weight: 600; }
  #legend { position: absolute; left: 16px; bottom: 28px; z-index: 2; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; font-size: 12px; line-height: 1.7; cursor: move; user-select: none; touch-action: none; }
  #legend .ttl { font-weight: 600; color: var(--muted); font-size: 11px; margin-bottom: 2px; }
  .sw { display: inline-block; width: 11px; height: 11px; border-radius: 50%; border: 1px solid #555; vertical-align: -2px; margin-right: 6px; background: #fff; }
  .sw.sq { border-radius: 2px; }
  .sw.dia { border-radius: 0; transform: rotate(45deg); width: 9px; height: 9px; }
  .sw.ring { box-shadow: 0 0 0 3px #e03030; }
  #panel { position: absolute; top: 76px; right: 10px; z-index: 3; width: min(560px, calc(100vw - 20px)); max-height: calc(100vh - 70px);
    overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: none;
    box-shadow: 0 4px 16px #0003; font-size: 13px; }
  #panel.show { display: block; }
  #panel h2 { font-size: 15px; margin: 0 0 6px; display: flex; justify-content: space-between; align-items: center; }
  #panel .tree ul { list-style: none; margin: 0; padding-left: 16px; }
  #panel .tree li { line-height: 1.6; white-space: nowrap; }
  #panel .tree .fo { font-weight: 600; }
  #panel .tree small { color: var(--muted); margin-left: 6px; }
  #chartWrap { position: relative; height: 300px; }
  .maplibregl-popup-content { color: #222; font-size: 13px; line-height: 1.6; min-width: 220px; }
  .maplibregl-popup-content b { font-size: 14px; }
  .maplibregl-popup-content table { border-collapse: collapse; margin-top: 4px; }
  .maplibregl-popup-content td { padding: 0 8px 0 0; white-space: nowrap; }
  .maplibregl-popup-content .big { font-size: 22px; font-weight: 700; }
  .maplibregl-popup-content button { font: inherit; font-size: 13px; padding: 2px 10px; border: 1px solid #bbb; border-radius: 6px; background: #f4f4f4; cursor: pointer; }
  .maplibregl-ctrl-attrib { font-size: 11px; }
</style>
</head>
<body>
<div id="gate">
  <div class="box" style="border:none">
    <form id="gateForm"><div style="font-size:22px;margin-bottom:10px">🌊 観測サイト</div>
    <input type="password" id="gatePw" autocomplete="current-password" aria-label="password"> <button type="submit">→</button></form>
    <div id="gateMsg" style="color:#c00;font-size:13px;min-height:1.4em"></div>
  </div>
</div>
<div id="head">
  <div class="row">
    <h1>石川・富山 河川水位</h1>
    <span id="status">読み込み中…</span>
    <span id="updated"></span>
    <select id="base">
      <option value="gsi-pale">地理院 淡色</option>
      <option value="gsi-std">地理院 標準</option>
      <option value="gsi-photo">航空写真</option>
      <option value="osm">OpenStreetMap</option>
    </select>
    <button id="btnEvents">出水記録</button>
    <button id="btnLedger">Drive台帳</button>
    <a id="dataLink" href="#" target="_blank" rel="noopener">保存先（Drive）</a>
    <a href="https://www.river.go.jp/" target="_blank" rel="noopener">出典: 川の防災情報</a>
    <button id="btnLogin" title="合言葉を忘れてログアウト">🔓</button>
  </div>
  <div class="row">
    <label><input type="checkbox" id="chkStg" checked> 水位計</label>
    <label><input type="checkbox" id="chkSw" checked> 危機管理型</label>
    <label><input type="checkbox" id="chkCity" checked> 富山市</label>
    <label><input type="checkbox" id="chkTide" checked> 潮位</label>
    <label><input type="checkbox" id="chkMissing"> 欠測も表示</label>
    <label><input type="checkbox" id="chkTrig"> トリガー地点</label>
    <label><input type="checkbox" id="chkPeak"> 期間最大で色分け</label>
    <button id="btnPeak">危なかった地点</button>
    <label style="margin-left:10px"><input type="checkbox" id="chkCam"> 📷 カメラ</label>
  </div>
</div>
<div id="map"></div>
<div id="legend">
  <div class="ttl">凡例（ドラッグで移動）</div>
  <div><span class="sw"></span>平常（○ 水位計 / <span class="sw sq" style="margin:0 2px 0 0"></span>危機管理型 / <span class="sw dia" style="margin:0 4px 0 2px"></span>潮位）</div>
  <div><span class="sw" style="background:#e03030"></span>氾濫危険水位 以上</div>
  <div><span class="sw" style="background:#8b008b"></span>氾濫開始・計画高水位 以上</div>
  <div><span class="sw" style="background:#bbb"></span>欠測</div>
  <div id="legendPeak" style="display:none"><span class="sw" style="background:#f2c100"></span>（期間最大）氾濫注意 <span class="sw" style="background:#f28c00;margin-left:6px"></span>避難判断</div>
  <div><span class="sw ring"></span>取得のトリガーになった地点</div>
  <div><span class="sw" style="background:#6cf;border-radius:2px"></span>📷 カメラ（<span class="sw" style="background:#ff8c00;border-radius:2px;margin:0 2px 0 0"></span>＝画像を保存済み）</div>
</div>
<div id="panel">
  <h2><span id="panelTitle"></span><button id="panelClose">閉じる</button></h2>
  <div id="panelBody"></div>
</div>
<script>
// Drive の読み取り口（Apps Script。読み取り専用・トークン不要）
const API_URL = "https://script.google.com/macros/s/AKfycbz45llyadCop21B1jEulhERWJw13LyrJMVpZvgzt5v26xK5uqBaE-QWsibhmldYyAS5/exec";

const TILES = {
  "gsi-pale": ["https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png", "地図:国土地理院"],
  "gsi-std": ["https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png", "地図:国土地理院"],
  "gsi-photo": ["https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg", "地図:国土地理院"],
  "osm": ["https://tile.openstreetmap.org/{z}/{x}/{y}.png", "&copy; OpenStreetMap contributors"],
};

function style(key) {
  const [url, attr] = TILES[key];
  return { version: 8, sources: { base: { type: "raster", tiles: [url], tileSize: 256, attribution: attr, maxzoom: 18 } },
           layers: [{ id: "base", type: "raster", source: "base" }] };
}

const map = new maplibregl.Map({ container: "map", style: style("gsi-pale"), center: [136.9, 36.75], zoom: 8.3 });
map.addControl(new maplibregl.NavigationControl(), "top-right");
// 現在地ボタン。位置情報はボタンを押したときだけ求める（自動追跡しない）
map.addControl(new maplibregl.GeolocateControl({ positionOptions: { enableHighAccuracy: true }, trackUserLocation: false }), "top-right");

let data = null, alert = { over: [] }, status = {}, peak = { peaks: {}, period: {} };
let cameras = null, camIndex = {}, stationCams = {};
// 観測所の近く（500 m 以内）のカメラ。無ければ「なし」と出す
const CAM_STATUS = { fog: "曇り", leaves: "葉で遮られる" };
function nearCamsHtml(p) {
  const e = stationCams[p.obs_id];
  if (e == null) return "";
  const list = e.near ?? [];
  const riverN = (e.river ?? []).length;
  const extra = riverN > list.length ? `<small>（同じ川に計 ${riverN} 台）</small>` : "";
  if (!list.length) return `<div><small>📷 近くにカメラなし</small>${extra}</div>`;
  return `<div><small>📷 ${list.map(c => `<a href="${c.img_url}" target="_blank" rel="noopener">${c.name}</a>（${c.dist_m} m${CAM_STATUS[c.status] ? "・" + CAM_STATUS[c.status] : ""}）`).join("、")}</small>${extra}</div>`;
}
const markers = [], camMarkers = [];
// 合言葉。Apps Script 側（スクリプトプロパティ VIEW_PASSWORD）で照合する。通ったらこのブラウザに記憶
let pw = "", authed = false;
try { pw = localStorage.getItem("viewPw") || ""; } catch (e) { /* 無視 */ }
async function verify(p) {
  try {
    const r = await (await fetch(`${API_URL}?auth=1&pw=${encodeURIComponent(p)}`)).json();
    if (!r.ok) return false;
    authed = true; pw = p;
    document.body.classList.add("auth");
    document.title = "石川・富山 河川水位";
    if (r.root) dataLink.href = r.root;
    try { localStorage.setItem("viewPw", p); } catch (e) { /* 無視 */ }
    return true;
  } catch (e) { return false; }
}
function logout() {
  authed = false; pw = "";
  document.body.classList.remove("auth");
  dataLink.href = "#";
  try { localStorage.removeItem("viewPw"); } catch (e) { /* 無視 */ }
}
const LV_NAME = ["基準未満", "水防団待機", "氾濫注意", "避難判断", "氾濫危険", "氾濫開始/計画高水位"];
const LV_COLOR = ["#fff", "#fff", "#f2c100", "#f28c00", "#e03030", "#8b008b"];
const SRC_OF = { stg: p => p.pref, swstg: p => p.pref, city: () => "toyama_city", tide: () => "jma_tide" };

// 0=平常 1=氾濫危険以上 2=氾濫開始・計画高水位以上 -1=欠測。色は氾濫危険から付ける
function levelOf(p) {
  const v = p.kind === "tide" ? p.tide_cm : p.stg;
  if (v == null || p.stg_ccd) return -1;
  if (p.kind === "city" || p.kind === "tide") return 0;
  if (p.fld_stg != null && v >= p.fld_stg) return 2;
  if (p.dng_stg != null && v >= p.dng_stg) return 1;
  return 0;
}
const LEVEL_COLOR = ["#fff", "#e03030", "#8b008b"];

function fmt(v) { return v == null ? "--" : (+v).toFixed(2); }
function isTrigger(p) { return alert.over.some(o => o.obs_id === p.obs_id && o.kind === p.kind); }

function popupHtml(p) {
  const src = SRC_OF[p.kind](p);
  const graphBtn = !authed ? "" : status.active || status.last_fetch
    ? `<button onclick="showChart('${src}','${p.obs_id}')">グラフ（保存中データ）</button>` : `<small>保存中のデータなし</small>`;
  if (p.kind === "tide") {
    return `<b>${p.obs_nm}</b> <small>潮位・${p.operator ?? ""}</small><br>
      <span class="big">${p.tide_cm ?? "--"}</span> cm <small>${p.obs_time ?? ""}</small>
      ${p.departure_cm != null ? `<div>偏差 ${p.departure_cm} cm</div>` : ""}
      <div><small>基準: ${p.reference ?? ""}</small></div>
      <div style="margin-top:6px">${graphBtn} <a href="${p.url}" target="_blank" rel="noopener">気象庁</a></div>`;
  }
  if (p.kind === "city") {
    return `<b>${p.obs_nm}</b> <small>富山市</small><br>
      <span class="big">${fmt(p.stg)}</span> m <small>${p.obs_time ?? ""}</small>
      ${p.diff != null ? `<div>前回比 ${p.diff} m</div>` : ""}
      <div style="margin-top:6px">${graphBtn} <a href="${p.url}" target="_blank" rel="noopener">富山市サイト</a></div>`;
  }
  // 川の防災情報の地点ページ。危機管理型は itmkndCd=300（旧 k.river.go.jp は閉鎖済み）
  const [lon, lat] = p._coords ?? [];
  const url = `https://www.river.go.jp/kawabou/pc/tm?zm=15&clat=${lat}&clon=${lon}&fld=0` +
    `&ofcCd=${p.ofc_cd ?? ""}&itmkndCd=${p.itmknd_cd ?? (p.kind === "stg" ? 4 : 300)}&obsCd=${p.obs_cd ?? ""}`;
  const thr = p.kind === "stg"
    ? [["水防団待機", p.rsrv_stg], ["氾濫注意", p.warn_stg], ["避難判断", p.spcl_warn_stg], ["氾濫危険", p.dng_stg], ["計画高水位", p.fld_stg]]
    : [["観測開始", p.rsrv_stg], ["氾濫危険", p.dng_stg], ["氾濫開始", p.fld_stg]];
  const rows = thr.filter(([, v]) => v != null).map(([k, v]) => `<tr><td>${k}</td><td>${fmt(v)} m</td></tr>`).join("");
  const miss = p.stg == null || p.stg_ccd ? `<div style="color:#c00">欠測 (code ${p.stg_ccd ?? "-"})</div>` : "";
  const trig = authed && isTrigger(p) ? `<div style="color:#c00">▶ 取得のトリガー地点（氾濫注意水位以上）</div>` : "";
  const pk = authed ? peak.peaks[p.obs_id] : null;
  const pkHtml = pk ? `<div>期間最大 <b>${fmt(pk.max)} m</b> <small>${pk.at}</small>${pk.lv != null ? ` <span style="color:${pk.lv >= 2 ? "#c00" : "#555"}">${LV_NAME[pk.lv]}</span>` : ""}</div>` : "";
  return `<b>${p.obs_nm}</b> <small>${p.kind === "stg" ? "水位計" : "危機管理型"}</small><br>
    <span class="big">${fmt(p.stg)}</span> m <small>${p.obs_time ?? ""}</small>${miss}${trig}${pkHtml}${nearCamsHtml(p)}
    <table>${rows}</table>
    <div style="margin-top:6px">${graphBtn} <a href="${url}" target="_blank" rel="noopener">川の防災情報</a></div>`;
}

function render() {
  markers.forEach(m => m.remove());
  markers.length = 0;
  if (!data) return;
  const show = { stg: chkStg.checked, swstg: chkSw.checked, city: chkCity.checked, tide: chkTide.checked };
  const showMissing = chkMissing.checked, showTrig = chkTrig.checked, byPeak = chkPeak.checked;
  legendPeak.style.display = byPeak ? "" : "none";
  let shown = 0;
  for (const f of data.features) {
    const p = f.properties;
    if (!show[p.kind]) continue;
    let lv = levelOf(p), color, size;
    if (byPeak) {
      // 取得期間中の最大水位で色分け（氾濫注意から色を付ける）
      const pk = peak.peaks[p.obs_id];
      const plv = pk && pk.lv != null ? pk.lv : (pk ? 0 : -1);
      if (plv < 0 && !showMissing) continue;
      color = plv < 0 ? "#bbb" : LV_COLOR[plv];
      size = plv >= 2 ? 14 : 8;
      lv = plv;
    } else {
      if (lv < 0 && !showMissing) continue;
      color = lv < 0 ? "#bbb" : LEVEL_COLOR[lv];
      size = lv >= 1 ? 14 : 8;
    }
    const trig = showTrig && isTrigger(p);
    const el = document.createElement("div");
    const shape = p.kind === "swstg" ? "border-radius:2px" : p.kind === "tide" ? "border-radius:0;transform:rotate(45deg)" : "border-radius:50%";
    el.style.cssText = `width:${size}px;height:${size}px;border:1px solid #444;cursor:pointer;background:${color};${shape};` +
      (trig ? "box-shadow:0 0 0 3px #e03030;" : "box-shadow:0 0 0 1px #fff;");
    el.title = p.kind === "tide" ? `${p.obs_nm} ${p.tide_cm ?? "--"} cm` : `${p.obs_nm} ${fmt(p.stg)} m`;
    p._coords = f.geometry.coordinates;
    const m = new maplibregl.Marker({ element: el }).setLngLat(f.geometry.coordinates)
      .setPopup(new maplibregl.Popup({ offset: 10, maxWidth: "320px" }).setHTML(popupHtml(p))).addTo(map);
    markers.push(m);
    shown++;
  }
  updated.textContent = `更新 ${data.updated}（${shown} / ${data.features.length} 地点）`;
  renderCameras();
  const st = document.getElementById("status");
  if (status.active) {
    st.className = "active";
    st.textContent = `全地点を取得中 ${status.since ?? ""}〜（最終 ${status.last_fetch}、トリガー ${alert.over.length} 地点）`;
  } else {
    st.className = "";
    st.textContent = status.last_fetch ? `待機中（最終取得 ${status.last_fetch}）` : "待機中（取得なし）";
  }
}

// 河川カメラ（簡易型河川監視カメラ・CCTV）。撮るのは氾濫開始水位以上の観測所の近くだけ
function camPopup(p) {
  const ix = authed ? (camIndex[p.scam_id] ?? {}) : {};
  const saved = !authed ? "" : ix.count ? `<div>保存 ${ix.count} 枚（最新 ${ix.last_time ?? ""}）
    <a href="${dataLink.href}" target="_blank" rel="noopener">Drive の camera/${p.scam_id}/</a></div>` : `<div><small>保存画像なし</small></div>`;
  const near = ix.stations ? `<div><small>対象観測所: ${ix.stations.map(s => `${s.obs_nm}(${s.dist_m}m)`).join("、")}</small></div>` : "";
  return `<b>📷 ${p.name}</b> <small>${p.kind === "scam" ? "簡易型河川監視カメラ" : "CCTV"}</small>
    <div style="margin:6px 0"><a href="${p.img_url}" target="_blank" rel="noopener"><img src="${p.img_url}?t=${Date.now()}" style="width:280px;display:block;border:1px solid #ccc" alt="現在の画像"></a>
    <small>現在の画像（クリックで原寸、約10分ごとに更新）</small></div>${saved}${near}`;
}

function renderCameras() {
  camMarkers.forEach(m => m.remove());
  camMarkers.length = 0;
  if (!chkCam.checked || !cameras) return;
  for (const f of cameras.features) {
    const p = f.properties;
    const el = document.createElement("div");
    const saved = authed && (camIndex[p.scam_id]?.count ?? 0) > 0;
    el.style.cssText = `width:10px;height:10px;border:1px solid #333;background:${saved ? "#ff8c00" : "#6cf"};cursor:pointer;` +
      `clip-path:polygon(0 25%,30% 25%,40% 0,60% 0,70% 25%,100% 25%,100% 100%,0 100%)`;
    el.title = `📷 ${p.name}`;
    const m = new maplibregl.Marker({ element: el }).setLngLat(f.geometry.coordinates)
      .setPopup(new maplibregl.Popup({ offset: 8, maxWidth: "320px" }).setHTML(camPopup(p))).addTo(map);
    camMarkers.push(m);
  }
}

async function getJson(name) {
  try { return await (await fetch(name + "?t=" + Date.now(), { cache: "no-store" })).json(); } catch (e) { return null; }
}

async function load() {
  const [a, b, c, al, st, pk, cm, ci, sc] = await Promise.all([
    getJson("latest.geojson"), getJson("latest_toyama_city.geojson"), getJson("latest_jma_tide.geojson"),
    getJson("alert.json"), getJson("status.json"), getJson("peak.json"), getJson("cameras.geojson"), getJson("camera_index.json"),
    getJson("station_cameras.json")]);
  stationCams = sc ?? {};
  if (!a) { updated.textContent = "読み込み失敗"; return; }
  data = { updated: a.updated, features: [...a.features, ...(b?.features ?? []), ...(c?.features ?? [])] };
  alert = al ?? { over: [] };
  status = st ?? {};
  peak = pk ?? { peaks: {}, period: {} };
  cameras = cm;
  camIndex = ci ?? {};
  render();
}

// 合言葉の入口。通ったら地図を読み込む。記憶があれば自動で通す
gateForm.onsubmit = async e => {
  e.preventDefault();
  gateMsg.textContent = "確認中…";
  if (await verify(gatePw.value)) { gateMsg.textContent = ""; load(); map.resize(); }
  else gateMsg.textContent = "×";
};

// ---- パネル（グラフ / データ台帳）----
const panel = document.getElementById("panel"), panelTitle = document.getElementById("panelTitle"), panelBody = document.getElementById("panelBody");
let chart = null;
function openPanel(title, html) { panelTitle.textContent = title; panelBody.innerHTML = html; panel.classList.add("show"); }
panelClose.onclick = () => { panel.classList.remove("show"); if (chart) { chart.destroy(); chart = null; } };

async function showChart(src, id) {
  openPanel("時系列", "<div>Drive から読み込み中…（数秒かかります）</div>");
  let r;
  try { r = await (await fetch(`${API_URL}?series=${src}&id=${encodeURIComponent(id)}&pw=${encodeURIComponent(pw)}`)).json(); }
  catch (e) { panelBody.textContent = "読み込み失敗: " + e; return; }
  if (!r.ok) { panelBody.textContent = "取得できません: " + r.error; return; }
  const p = data.features.map(f => f.properties).find(q => q.obs_id === id) ?? {};
  const t0 = new Date(r.t0.replace(/\//g, "-").replace(" ", "T") + ":00");
  const labels = r.v.map((_, i) => new Date(t0.getTime() + i * r.step * 60000));
  const unit = src === "jma_tide" ? "cm" : "m";
  panelTitle.textContent = `${r.name}（${src}）`;
  panelBody.innerHTML = `<div id="chartWrap"><canvas id="cv"></canvas></div>
    <div><small>Drive の series/${src}.json、更新 ${r.updated}。${r.step}分値 ${r.v.filter(v => v != null).length} 点</small></div>`;
  const datasets = [{ label: `水位 [${unit}]`, data: r.v, borderColor: "#1f5fbf", borderWidth: 1.5, pointRadius: 0, spanGaps: false }];
  const lines = [["水防団待機", p.rsrv_stg, "#f2c100"], ["氾濫注意", p.warn_stg, "#f28c00"], ["避難判断", p.spcl_warn_stg, "#e03030"],
                 ["氾濫危険", p.dng_stg, "#8b008b"], ["計画高水位/氾濫開始", p.fld_stg, "#444"]];
  for (const [label, v, color] of lines) {
    if (v != null && src !== "jma_tide" && src !== "toyama_city")
      datasets.push({ label, data: r.v.map(() => v), borderColor: color, borderWidth: 1, borderDash: [4, 4], pointRadius: 0 });
  }
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  chart = new Chart(document.getElementById("cv"), {
    type: "line",
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { labels: { color: dark ? "#ddd" : "#333", boxWidth: 18 } } },
      scales: {
        x: { ticks: { color: dark ? "#ccc" : "#444", maxTicksLimit: 8,
               callback: (v, i) => { const d = labels[i]; return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; } },
             grid: { color: dark ? "#444" : "#e5e5e5" } },
        y: { ticks: { color: dark ? "#ccc" : "#444" }, grid: { color: dark ? "#444" : "#e5e5e5" }, title: { display: true, text: unit } },
      },
    },
  });
}

function treeHtml(node) {
  const fmtSize = n => n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : n >= 1024 ? Math.round(n / 1024) + " KB" : n + " B";
  const files = node.files.map(f => `<li><a href="${f.url}" target="_blank" rel="noopener">${f.name}</a><small>${fmtSize(f.size)} · ${f.updated.slice(0, 16).replace("T", " ")}</small></li>`).join("");
  const folders = node.folders.map(c => `<li><span class="fo">📁 ${c.name}</span>${treeHtml(c)}</li>`).join("");
  return `<ul>${folders}${files}</ul>`;
}

// 出水ごとの記録（events.json）。棚卸のとき Drive のどの日付がどの出水か分かるように
function eventsHtml(events) {
  if (!events || !events.length) return "<div><small>出水の記録はまだありません</small></div>";
  const rows = [...events].reverse().map(e => {
    const m = e.max_station;
    return `<tr><td><small>${e.since}<br>〜 ${e.until ?? "<b style='color:#a00'>継続中</b>"}</small></td>
      <td>${m ? `${m.obs_nm} <small>${m.pref === "ishikawa" ? "石川" : "富山"}</small><br><b>${(+m.max).toFixed(2)} m</b> <small>${m.lv_name}・${m.at}</small>` : "--"}</td>
      <td style="text-align:right">${e.over_warn ?? 0}</td><td style="text-align:right">${e.flooded ?? 0}${e.flooded_names?.length ? `<br><small>${e.flooded_names.slice(0, 4).join("、")}${e.flooded_names.length > 4 ? "…" : ""}</small>` : ""}</td>
      <td style="text-align:right">${e.cameras ?? 0} 台<br><small>${e.camera_images ?? 0} 枚</small></td>
      <td><small>${e.trigger === "manual" ? "手動" : "自動"}</small></td></tr>`;
  }).join("");
  return `<table style="border-collapse:collapse;width:100%;margin-bottom:10px">
    <tr style="color:var(--muted)"><td>期間</td><td>最大水位の観測所</td><td>氾濫注意以上</td><td>氾濫開始超え</td><td>カメラ</td><td></td></tr>${rows}</table>`;
}

  panelBody.innerHTML = desc + `<div class="tree">${treeHtml(r.tree)}</div>`;

// 凡例をドラッグで移動。位置はこのブラウザに記憶する
(function () {
  const el = legend;
  const place = (x, y) => {
    x = Math.max(0, Math.min(innerWidth - el.offsetWidth, x));
    y = Math.max(0, Math.min(innerHeight - el.offsetHeight, y));
    el.style.left = x + "px"; el.style.top = y + "px"; el.style.bottom = "auto";
  };
  try {
    const s = JSON.parse(localStorage.getItem("legendPos") || "null");
    if (s) place(s.x, s.y);
  } catch (e) { /* 記憶なし */ }
  let drag = null;
  el.addEventListener("pointerdown", e => {
    drag = { dx: e.clientX - el.offsetLeft, dy: e.clientY - el.offsetTop };
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener("pointermove", e => { if (drag) place(e.clientX - drag.dx, e.clientY - drag.dy); });
  el.addEventListener("pointerup", () => {
    if (!drag) return;
    drag = null;
    try { localStorage.setItem("legendPos", JSON.stringify({ x: el.offsetLeft, y: el.offsetTop })); } catch (e2) { /* 無視 */ }
  });
})();
